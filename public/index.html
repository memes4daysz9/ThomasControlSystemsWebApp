    <script>
    (function(){
        // Adjustable smooth scrolling to in-page anchors with header offset
        var DEFAULT_SCROLL_DURATION = 850; // milliseconds - change this to adjust speed globally

        function getHeaderHeight() {
            var h = document.querySelector('.site-header');
            return h ? h.offsetHeight : 0;
        }

        // ease-in-out cubic for smooth, natural acceleration/deceleration
        function easeInOutCubic(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function scrollToElement(el, smooth, duration) {
            var headerH = getHeaderHeight();
            var rect = el.getBoundingClientRect();
            var target = window.scrollY + rect.top - headerH - 12; // small gap

            if (!smooth || duration === 0) {
                window.scrollTo({ top: target, behavior: 'auto' });
                return;
            }

            duration = (typeof duration === 'number') ? duration : DEFAULT_SCROLL_DURATION;

            var start = window.scrollY;
            var distance = target - start;
            var startTime = performance.now();

            function step(now) {
                var elapsed = now - startTime;
                var progress = Math.min(1, elapsed / duration);
                var eased = easeInOutCubic(progress);
                window.scrollTo(0, Math.round(start + distance * eased));
                if (progress < 1) requestAnimationFrame(step);
            }

            requestAnimationFrame(step);
        }

        // Handle clicks on hash links
        document.addEventListener('click', function(e){
            var a = e.target.closest('a');
            if (!a) return;
            var href = a.getAttribute('href');
            if (!href) return;
            // Only intercept same-page hashes like '#id'
            if (href.charAt(0) === '#') {
                var id = href.slice(1);
                var el = document.getElementById(id);
                if (el) {
                    e.preventDefault();
                    history.replaceState(null, '', href);
                    // Support per-anchor override via data-scroll-duration (ms)
                    var durAttr = a.dataset ? a.dataset.scrollDuration : null;
                    var dur = durAttr ? parseInt(durAttr, 10) : undefined;
                    scrollToElement(el, true, dur);
                }
            }
        }, false);

        // On load, if there's a hash, scroll to it (without smooth so it's immediate)
        window.addEventListener('load', function(){
            if (location.hash) {
                var id = location.hash.slice(1);
                var el = document.getElementById(id);
                if (el) {
                    // Slight delay to allow layout/sticky header to settle
                    setTimeout(function(){ scrollToElement(el, false); }, 50);
                }
            }
        });
    })();
    </script>
